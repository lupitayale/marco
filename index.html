<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fotomatón - Boda Lupita & Ale</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Pantalla de Selección de Marcos (Menú Inicial) */
        #menu-selector {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f4efe9 0%, #e6dcd0 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
        }
        #menu-selector h1 {
            font-size: 1.8rem;
            color: #5a4a42;
            margin-bottom: 5px;
        }
        #menu-selector p {
            color: #7c6b61;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .opciones-marcos {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 320px;
        }
        .btn-marco {
            background-color: #fff;
            border: 2px solid #d4c5b9;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            color: #5a4a42;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
            font-weight: 600;
        }
        .btn-marco:active {
            transform: scale(0.97);
            background-color: #f7f5f2;
        }

        /* Pantalla de Cámara */
        #pantalla-camara {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background: #000;
        }
        
        .camera-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1; /* La cámara está al fondo */
        }

        #video.modo-selfie {
            transform: scaleX(-1);
        }

        /* Canvas oculto que procesa el marco verde y lo vuelve transparente en tiempo real */
        #marco-canvas-preview {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: fill;
            z-index: 2; /* El marco procesado va encima de la cámara */
            pointer-events: none;
        }
        
        /* Controles superiores (Zoom) */
        .controles-zoom {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
        }
        .btn-zoom {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Controles inferiores */
        .controles {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }
        #btnCapturar {
            width: 75px;
            height: 75px;
            background-color: #fff;
            border: 5px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            cursor: pointer;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.1s ease;
        }
        #btnCapturar:active {
            transform: scale(0.9);
        }
        .btn-control-secundario {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        #canvas-captura { display: none; }
        
        #mensaje-camara {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            z-index: 20;
            display: none;
        }
    </style>
</head>
<body>

    <!-- MENÚ INICIAL -->
    <div id="menu-selector">
        <h1>Boda Lupita & Ale</h1>
        <p>11 de Septiembre de 2026</p>
        <p style="font-size: 0.85rem; margin-top: -15px;">Elige tu marco favorito para la foto:</p>
        
        <div class="opciones-marcos">
            <button class="btn-marco" onclick="iniciarExperiencia('marco-boda.png')">🌸 Marco Elegante Boda</button>
            <button class="btn-marco" onclick="iniciarExperiencia('marco-divertido.png')">🎉 Marco Divertido / Fiesta</button>
        </div>
    </div>

    <!-- PANTALLA DE CÁMARA -->
    <div id="pantalla-camara">
        <div id="mensaje-camara">Activando cámara HD...</div>
        
        <div class="controles-zoom">
            <button class="btn-zoom" onclick="cambiarZoom(0.2)">+</button>
            <button class="btn-zoom" onclick="cambiarZoom(-0.2)">-</button>
        </div>

        <div class="camera-container">
            <video id="video" autoplay playsinline muted></video>
            <!-- Canvas en tiempo real que quita el verde y muestra la cámara por detrás -->
            <canvas id="marco-canvas-preview"></canvas>
        </div>
        
        <div class="controles">
            <button class="btn-control-secundario" onclick="regresarAlMenu()">← Menú</button>
            <button id="btnCapturar" aria-label="Tomar foto"></button>
            <button class="btn-control-secundario" onclick="voltearCamara()">🔄 Voltear</button>
        </div>
        
        <canvas id="canvas-captura"></canvas>
    </div>

    <script>
        const menuSelector = document.getElementById('menu-selector');
        const pantallaCamara = document.getElementById('pantalla-camara');
        const video = document.getElementById('video');
        const previewCanvas = document.getElementById('marco-canvas-preview');
        const previewCtx = previewCanvas.getContext('2d', {willReadFrequently: true});
        const capturaCanvas = document.getElementById('canvas-captura');
        const mensajeCamara = document.getElementById('mensaje-camara');
        
        let currentStream = null;
        let usarCamaraTrasera = true; 
        let zoomActual = 1;
        let zoomMin = 1;
        let zoomMax = 1;
        let imagenMarcoGlobal = new Image();

        async function iniciarExperiencia(nombreArchivoMarco) {
            menuSelector.style.display = 'none';
            pantallaCamara.style.display = 'block';
            mensajeCamara.style.display = 'block';
            mensajeCamara.innerText = "Cargando marco y cámara...";

            // Cargar la imagen del marco y procesarla para quitar el verde brillante
            imagenMarcoGlobal.crossOrigin = "anonymous";
            imagenMarcoGlobal.onload = async function() {
                await cargarCamara();
            };
            imagenMarcoGlobal.src = nombreArchivoMarco;
        }

        async function cargarCamara() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const facing = usarCamaraTrasera ? 'environment' : 'user';
                const constraints = {
                    video: {
                        facingMode: { ideal: facing },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                };
                
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;

                const track = currentStream.getVideoTracks()[0];
                const capabilities = track.getCapabilities();
                
                if (capabilities.zoom) {
                    zoomMin = capabilities.zoom.min;
                    zoomMax = capabilities.zoom.max;
                    zoomActual = zoomMin;
                    try {
                        await track.applyConstraints({ advanced: [{ zoom: zoomMin }] });
                    } catch (e) {}
                }

                if (!usarCamaraTrasera) {
                    video.classList.add('modo-selfie');
                } else {
                    video.classList.remove('modo-selfie');
                }

                mensajeCamara.style.display = 'none';
                
                // Ajustar tamaños y empezar a renderizar el marco sin fondo verde
                AjustarYRenderizarMarco();

            } catch (error) {
                console.error("Error al abrir cámara:", error);
                try {
                    const fallback = { video: { facingMode: usarCamaraTrasera ? 'environment' : 'user' }, audio: false };
                    currentStream = await navigator.mediaDevices.getUserMedia(fallback);
                    video.srcObject = currentStream;
                    mensajeCamara.style.display = 'none';
                    AjustarYRenderizarMarco();
                } catch (err2) {
                    mensajeCamara.style.display = 'block';
                    mensajeCamara.innerHTML = "⚠️ No se pudo acceder a la cámara.";
                }
            }
        }

        // Función clave que detecta el color verde fosfo y lo vuelve transparente
        function AjustarYRenderizarMarco() {
            if (!imagenMarcoGlobal.src) return;

            previewCanvas.width = video.videoWidth || 1080;
            previewCanvas.height = video.videoHeight || 1920;

            previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            previewCtx.drawImage(imagenMarcoGlobal, 0, 0, previewCanvas.width, previewCanvas.height);

            // Leer los pixeles para borrar el verde brillante del centro
            const frame = previewCtx.getImageData(0, 0, previewCanvas.width, previewCanvas.height);
            const l = frame.data.length;

            for (let i = 0; i < l; i += 4) {
                let r = frame.data[i];
                let g = frame.data[i + 1];
                let b = frame.data[i + 2];

                // Detectar si el pixel es verde brillante (Verde alto, Rojo y Azul bajos)
                if (g > 200 && r < 50 && b < 50) {
                    frame.data[i + 3] = 0; // Poner opacidad a 0 (transparente)
                }
            }
            previewCtx.putImageData(frame, 0, 0);
        }

        async function cambiarZoom(cantidad) {
            if (!currentStream) return;
            const track = currentStream.getVideoTracks()[0];
            const capabilities = track.getCapabilities();

            if (capabilities.zoom) {
                zoomActual = Math.min(zoomMax, Math.max(zoomMin, zoomActual + cantidad));
                try {
                    await track.applyConstraints({ advanced: [{ zoom: zoomActual }] });
                } catch (err) {}
            }
        }

        function voltearCamara() {
            usarCamaraTrasera = !usarCamaraTrasera;
            cargarCamara();
        }

        function regresarAlMenu() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            video.srcObject = null;
            pantallaCamara.style.display = 'none';
            menuSelector.style.display = 'flex';
        }

        // Tomar la foto final uniendo video y el marco procesado sin verde
        document.getElementById('btnCapturar').addEventListener('click', () => {
            if (!video.srcObject) return;

            capturaCanvas.width = video.videoWidth || 1920;
            capturaCanvas.height = video.videoHeight || 1080;
            const ctx = capturaCanvas.getContext('2d');

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            ctx.save();
            if (!usarCamaraTrasera) {
                ctx.translate(capturaCanvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, capturaCanvas.width, capturaCanvas.height);
            ctx.restore();

            // Dibujar el marco procesado sin el cuadro verde encima
            ctx.drawImage(previewCanvas, 0, 0, capturaCanvas.width, capturaCanvas.height);
            
            const dataURL = capturaCanvas.toDataURL('image/jpeg', 1.0);
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'boda-lupita-ale-recuerdo.jpg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
