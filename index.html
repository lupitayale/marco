<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fotomatón - Boda Lupita & Ale</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Pantalla de Selección de Marcos (Menú Inicial) */
        #menu-selector {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f4efe9 0%, #e6dcd0 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
        }
        #menu-selector h1 {
            font-size: 1.8rem;
            color: #5a4a42;
            margin-bottom: 5px;
        }
        #menu-selector p {
            color: #7c6b61;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .opciones-marcos {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 320px;
        }
        .btn-marco {
            background-color: #fff;
            border: 2px solid #d4c5b9;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            color: #5a4a42;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
            font-weight: 600;
        }
        .btn-marco:active {
            transform: scale(0.97);
            background-color: #f7f5f2;
        }

        /* Pantalla de Cámara */
        #pantalla-camara {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background: #000;
        }
        
        .camera-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #video.modo-selfie {
            transform: scaleX(-1);
        }

        #marco-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: fill; 
            z-index: 2;
            pointer-events: none;
        }
        
        /* Controles superiores (Zoom) */
        .controles-zoom {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
        }
        .btn-zoom {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Controles inferiores */
        .controles {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }
        #btnCapturar {
            width: 75px;
            height: 75px;
            background-color: #fff;
            border: 5px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            cursor: pointer;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.1s ease;
        }
        #btnCapturar:active {
            transform: scale(0.9);
        }
        .btn-control-secundario {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        #canvas { display: none; }
        
        #mensaje-camara {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            z-index: 20;
            display: none;
        }
    </style>
</head>
<body>

    <!-- MENÚ INICIAL -->
    <div id="menu-selector">
        <h1>Boda Lupita & Ale</h1>
        <p>11 de Septiembre de 2026</p>
        <p style="font-size: 0.85rem; margin-top: -15px;">Elige tu marco favorito para la foto:</p>
        
        <div class="opciones-marcos">
            <button class="btn-marco" onclick="iniciarExperiencia('marco-boda.png')">🌸 Marco Elegante Boda</button>
            <button class="btn-marco" onclick="iniciarExperiencia('marco-divertido.png')">🎉 Marco Divertido / Fiesta</button>
        </div>
    </div>

    <!-- PANTALLA DE CÁMARA -->
    <div id="pantalla-camara">
        <div id="mensaje-camara">Activando cámara...</div>
        
        <!-- Botones de Zoom en la esquina superior derecha -->
        <div class="controles-zoom">
            <button class="btn-zoom" onclick="cambiarZoom(0.2)">+</button>
            <button class="btn-zoom" onclick="cambiarZoom(-0.2)">-</button>
        </div>

        <div class="camera-container">
            <video id="video" autoplay playsinline muted></video>
            <img id="marco-overlay" src="" alt="Marco seleccionado">
        </div>
        
        <div class="controles">
            <button class="btn-control-secundario" onclick="regresarAlMenu()">← Menú</button>
            <button id="btnCapturar" aria-label="Tomar foto"></button>
            <button class="btn-control-secundario" onclick="voltearCamara()">🔄 Voltear</button>
        </div>
        
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const menuSelector = document.getElementById('menu-selector');
        const pantallaCamara = document.getElementById('pantalla-camara');
        const video = document.getElementById('video');
        const marcoOverlay = document.getElementById('marco-overlay');
        const canvas = document.getElementById('canvas');
        const mensajeCamara = document.getElementById('mensaje-camara');
        
        let currentStream = null;
        let usarCamaraTrasera = true; 
        let zoomActual = 1;
        let zoomMin = 1;
        let zoomMax = 1;
        let zoomStep = 0.2;

        async function iniciarExperiencia(nombreArchivoMarco) {
            marcoOverlay.src = nombreArchivoMarco;
            menuSelector.style.display = 'none';
            pantallaCamara.style.display = 'block';
            await cargarCamara();
        }

        async function cargarCamara() {
            mensajeCamara.style.display = 'block';
            mensajeCamara.innerText = "Activando cámara...";

            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const facing = usarCamaraTrasera ? 'environment' : 'user';
                const constraints = {
                    video: {
                        facingMode: { ideal: facing },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                };
                
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;

                // Configurar capacidades de Zoom si el dispositivo las soporta
                const track = currentStream.getVideoTracks()[0];
                const capabilities = track.getCapabilities();
                
                if (capabilities.zoom) {
                    zoomMin = capabilities.zoom.min;
                    zoomMax = capabilities.zoom.max;
                    zoomStep = capabilities.zoom.step || 0.2;
                    zoomActual = track.getSettings().zoom || zoomMin;
                } else {
                    zoomMin = 1;
                    zoomMax = 1;
                }

                if (!usarCamaraTrasera) {
                    video.classList.add('modo-selfie');
                } else {
                    video.classList.remove('modo-selfie');
                }

                mensajeCamara.style.display = 'none';
            } catch (error) {
                console.error("Error al abrir la cámara:", error);
                try {
                    const fallback = {
                        video: { facingMode: usarCamaraTrasera ? 'environment' : 'user' },
                        audio: false
                    };
                    currentStream = await navigator.mediaDevices.getUserMedia(fallback);
                    video.srcObject = currentStream;
                    mensajeCamara.style.display = 'none';
                } catch (err2) {
                    mensajeCamara.style.display = 'block';
                    mensajeCamara.innerHTML = "⚠️ No se pudo acceder a la cámara.";
                }
            }
        }

        async function cambiarZoom(cantidad) {
            if (!currentStream) return;
            const track = currentStream.getVideoTracks()[0];
            const capabilities = track.getCapabilities();

            if (capabilities.zoom) {
                zoomActual = Math.min(zoomMax, Math.max(zoomMin, zoomActual + cantidad));
                try {
                    await track.applyConstraints({ advanced: [{ zoom: zoomActual }] });
                } catch (err) {
                    console.error("No se pudo aplicar el zoom:", err);
                }
            }
        }

        function voltearCamara() {
            usarCamaraTrasera = !usarCamaraTrasera;
            zoomActual = 1; // Reiniciar zoom al cambiar de cámara
            cargarCamara();
        }

        function regresarAlMenu() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            video.srcObject = null;
            pantallaCamara.style.display = 'none';
            menuSelector.style.display = 'flex';
        }

        // Captura final integrada
        document.getElementById('btnCapturar').addEventListener('click', () => {
            if (!video.srcObject) return;

            canvas.width = video.videoWidth || 1920;
            canvas.height = video.videoHeight || 1080;
            const ctx = canvas.getContext('2d');

            ctx.save();
            if (!usarCamaraTrasera) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = function() {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                const dataURL = canvas.toDataURL('image/jpeg', 0.95);
                const link = document.createElement('a');
                link.href = dataURL;
                link.download = 'boda-lupita-ale.jpg';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };
            img.src = marcoOverlay.src;
        });
    </script>
</body>
</html>
